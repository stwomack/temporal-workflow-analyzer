[project]
name = "temporal-repo-scanner"
version = "0.1.0"
description = "Scan a public GitHub repository for Temporal best practice violations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "temporalio",
    "claude-agent-sdk",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error:Module .* was imported after initial workflow load:UserWarning",
]
markers = [
    "e2e: end-to-end tests that need DEMO_REPO_URL and ANTHROPIC_API_KEY",
]
